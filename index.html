        <h1>TODO TASK WITH LOCAL STORAGE</h1>
        <div class="container mt-5">
            <div class="row">
                <div class="col-md-5 mb-4 mb-md-0">
                    <div class="card">
                        <div class="card-body">
                            <form id="todoForm">
                                <div class="form-group">
                                    <label for="todoInput">Enter your code:</label>
                                    <input required type="text" class="form-control" id="todoInput">
                                </div>
                                <button type="submit"  id="addbtn" class="btn btn-info btn-block btn-sm">Add todo</button>
                                <button type="button"  id="updatebtn" class="btn btn-secondary btn-block btn-sm d-none">Update todo</button>
                            </form>
                        </div>
                    </div>

                    </div>
                </div>
